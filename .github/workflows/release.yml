name: Build and attach release executables

# Two ways in:
#  1. Push an annotated tag matching v* -- the workflow creates the GitHub
#     Release itself (using the tag's own annotation as the release notes,
#     falling back to auto-generated notes), then builds and attaches the
#     executables. Use this from a normal git client when the GitHub API's
#     Releases endpoint isn't available to you.
#  2. Publish a release by hand in the GitHub UI -- the workflow just builds
#     and attaches the executables to that release.
# Either way, PyInstaller builds a native package per OS, each on its own
# OS-native runner (PyInstaller does not cross-compile): a Windows .exe, a
# Linux single-binary tarball, and a macOS .app bundled into a .dmg.
# A multi-arch Docker image (linux/amd64, linux/arm64) is also built and
# pushed to ghcr.io/<owner>/yotolib, tagged with the release tag, its
# semver forms (2.1.0, 2.1), and latest.
# Builds run in this repository and attach the files to its GitHub Release.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach executables to"
        required: true

permissions:
  contents: write

jobs:
  ensure-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and create release if needed
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping creation."
            exit 0
          fi
          notes="$(git tag -l --format='%(contents)' "$tag")"
          if [ -z "$notes" ]; then
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --generate-notes
          else
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --notes "$notes"
          fi

  build-executable:
    needs: [ensure-release]
    if: always() && (needs.ensure-release.result == 'success' || needs.ensure-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: ""
            ext: ".exe"
            icon_args: --icon=YJE.ico
            data_sep: ";"
          - os: ubuntu-latest
            suffix: "_linux"
            ext: ".tar.gz"
            icon_args: ""
            data_sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ needs.ensure-release.outputs.tag }}" ]; then
            echo "tag=${{ needs.ensure-release.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable
        # No --windowed: the app is a local server, and the console is how
        # you stop it. Static files are unpacked beside the executable at
        # runtime (sys._MEIPASS/static).
        shell: bash
        run: |
          pyinstaller --onefile ${{ matrix.icon_args }} \
            --add-data "static${{ matrix.data_sep }}static" \
            --collect-submodules uvicorn \
            --name "yotolib_${{ steps.tag.outputs.tag }}${{ matrix.suffix }}" \
            yotolib.py

      - name: Package as tar.gz (Linux only)
        # A bare Unix executable with no extension is normal (ls, git,
        # docker...), but a raw file downloaded from a browser doesn't
        # reliably keep its +x bit, and a lone binary with no packaging is
        # an unfamiliar download for most people. tar.gz is the standard
        # way single binaries like this are distributed (kubectl,
        # terraform, ...) and preserves the executable permission on
        # extraction.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          name="yotolib_${{ steps.tag.outputs.tag }}${{ matrix.suffix }}"
          chmod +x "dist/$name"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - name: Upload executable to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "dist/yotolib_${{ steps.tag.outputs.tag }}${{ matrix.suffix }}${{ matrix.ext }}" \
            --repo "${{ github.repository }}" \
            --clobber

  build-macos-dmg:
    needs: [ensure-release]
    if: always() && (needs.ensure-release.result == 'success' || needs.ensure-release.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ needs.ensure-release.outputs.tag }}" ]; then
            echo "tag=${{ needs.ensure-release.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .app bundle
        # No --onefile here: on macOS that produces a bare Mach-O binary
        # with no icon and no Info.plist, not a real Mac app. --windowed
        # alone makes PyInstaller emit a proper dist/<name>.app bundle.
        run: |
          pyinstaller --windowed \
            --add-data "static:static" \
            --collect-submodules uvicorn \
            --name "YotoLib" \
            yotolib.py

      - name: Package .dmg
        run: |
          app="dist/YotoLib.app"
          staging="dmg_staging"
          mkdir "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "YotoLib" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "dist/yotolib_${{ steps.tag.outputs.tag }}_macos.dmg"

      - name: Upload .dmg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "dist/yotolib_${{ steps.tag.outputs.tag }}_macos.dmg" \
            --repo "${{ github.repository }}" \
            --clobber

  build-image:
    needs: [ensure-release]
    if: always() && (needs.ensure-release.result == 'success' || needs.ensure-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine release tag
        id: tag
        # Values come in through env, not ${{ }} in the script, so a tag
        # name cannot inject shell commands.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          ENSURE_TAG: ${{ needs.ensure-release.outputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${INPUT_TAG:-${ENSURE_TAG:-$RELEASE_TAG}}"
          if [ -z "$tag" ]; then
            echo "No release tag found." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yotolib" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tag.outputs.image }}
          # latest only moves on a new release, not on a manual rebuild
          # of an older tag.
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
